name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 tests/test_wa.py
      - name: round trip a signed payload
        run: |
          python3 scripts/wa.py payload text > /tmp/p.json
          SIG=$(python3 scripts/wa.py signature --secret test --body-file /tmp/p.json)
          python3 scripts/wa.py signature --secret test --body-file /tmp/p.json --verify "$SIG"
